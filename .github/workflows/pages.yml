name: Verify and publish Forja
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['', '/tcgcreator']
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: node scripts/test-browser.mjs --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: matrix.base == '/tcgcreator' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
